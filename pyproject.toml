[project]
name = "publisher-backend"
version = "1.0.0"
description = "Modular publishing backend for distributing media productions to multiple publishing platforms."
requires-python = ">=3.11"
readme = "README.md"
dependencies = [
    "filelock>=3.20",
    "requests>=2.32",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.12",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["metadata", "models", "publishers"]
py-modules = ["config", "main"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
